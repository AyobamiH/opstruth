name: Cloudflare memberships 10001 reproduction

on:
  push:
    branches:
      - "repro/cloudflare-memberships-10001"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "cloudflare_api_token_present=yes"

      - name: Probe Cloudflare token type and memberships endpoint
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_ACCOUNT_ID || true

          probe() {
            local label="$1"
            local url="$2"
            local tmp
            tmp="$(mktemp)"
            local status
            status="$(curl --silent --show-error --output "$tmp" --write-out "%{http_code}"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               "$url")"

            LABEL="$label" STATUS="$status" FILE="$tmp" python - <<'PY'
import json, os
label=os.environ["LABEL"]
status=os.environ["STATUS"]
with open(os.environ["FILE"], "r", encoding="utf-8") as f:
    data=json.load(f)
errors=data.get("errors") or []
codes=[e.get("code") for e in errors if isinstance(e, dict)]
messages=[e.get("message") for e in errors if isinstance(e, dict)]
print(f"{label}_http={status}")
print(f"{label}_success={data.get('success')}")
print(f"{label}_error_codes={codes}")
print(f"{label}_error_messages={messages}")
PY
            rm -f "$tmp"
          }

          probe "user_token_verify" "https://api.cloudflare.com/client/v4/user/tokens/verify"
          probe "memberships" "https://api.cloudflare.com/client/v4/memberships"

      - name: Exercise latest Wrangler automatic account discovery
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_ACCOUNT_ID || true

          npx --yes wrangler@latest --version

          set +e
          output="$(npx --yes wrangler@latest whoami --json 2>&1)"
          status=$?
          set -e

          echo "wrangler_whoami_exit=$status"
          printf '%s
' "$output" | grep -Eo '/memberships|/accounts|\[code: [0-9]+\]|code: [0-9]+' | sort -u || true
